<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timer & Recorder</title>
  <style>
    body { font-family: monospace; padding: 40px; }
    #timer { font-size: 48px; margin-bottom: 20px; }
    button { font-size: 18px; padding: 10px 20px; margin: 5px; cursor: pointer; }
    #status { margin-top: 10px; color: #555; }
    #recordings { margin-top: 20px; }
    .recording-entry { margin: 8px 0; }
  </style>
</head>
<body>
  <div id="timer">00:30</div>
  <button id="recordBtn" onclick="toggleRecording()">Start Recording</button>
  <div id="status"></div>
  <div id="recordings"><strong>Saved Recordings:</strong></div>

  <script>
    let mediaRecorder = null;
    let chunks = [];
    let recordingCount = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let recordingBlobs = {}; // Store blobs by recording ID

    function updateDisplay() {
      const s = String(timeLeft).padStart(2, '0');
      document.getElementById('timer').textContent = `00:${s}`;
    }

    async function toggleRecording() {
      const btn = document.getElementById('recordBtn');
      const status = document.getElementById('status');

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          chunks = [];

          mediaRecorder.ondataavailable = e => chunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            recordingCount++;
            const timestamp = new Date().toLocaleTimeString();
            const recordingId = `recording-${recordingCount}`;
            
            // Store the blob for later transcription
            recordingBlobs[recordingId] = { blob: blob, filename: `recording_${recordingCount}.webm` };

            const div = document.createElement('div');
            div.className = 'recording-entry';
            div.id = recordingId;
            div.innerHTML = `Recording ${recordingCount} (${timestamp}): 
              <audio controls src="${url}"></audio> 
              <a href="${url}" download="recording_${recordingCount}.webm">Save</a>
              <button onclick="transcribeRecording(this, '${recordingId}')">Transcribe</button>
              <div id="transcript-${recordingId}" style="margin-top: 10px; display: none;"></div>`;
            document.getElementById('recordings').appendChild(div);

            status.textContent = `Recording ${recordingCount} saved.`;
            stream.getTracks().forEach(t => t.stop());

            // Reset timer display
            timeLeft = 30;
            updateDisplay();
          };

          mediaRecorder.start();
          btn.textContent = 'Stop Recording';
          status.textContent = 'Recording...';

          // Start countdown
          timeLeft = 30;
          updateDisplay();
          timerInterval = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft <= 0) {
              stopRecording();
            }
          }, 1000);

        } catch (err) {
          status.textContent = 'Microphone access denied: ' + err.message;
        }
      }
    }

    function stopRecording() {
      clearInterval(timerInterval);
      mediaRecorder.stop();
      document.getElementById('recordBtn').textContent = 'Start Recording';
      document.getElementById('status').textContent = 'Saving...';
    }

    async function transcribeRecording(button, recordingId) {
      const transcriptDiv = document.getElementById(`transcript-${recordingId}`);
      const originalText = button.textContent;
      
      try {
        const recordingData = recordingBlobs[recordingId];
        if (!recordingData) {
          transcriptDiv.textContent = 'Error: Recording data not found';
          transcriptDiv.style.color = '#d9534f';
          transcriptDiv.style.display = 'block';
          return;
        }

        button.disabled = true;
        button.textContent = 'Transcribing...';
        transcriptDiv.textContent = 'Processing...';
        transcriptDiv.style.display = 'block';
        transcriptDiv.style.color = '#666';

        // Prepare form data with the audio blob
        const formData = new FormData();
        formData.append('audio', recordingData.blob, recordingData.filename);

        // Send to server
        const response = await fetch('/transcribe', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          transcriptDiv.textContent = `Transcript: ${data.transcript}`;
          transcriptDiv.style.color = '#333';
          button.textContent = 'Transcribed ✓';
        } else {
          transcriptDiv.textContent = `Error: ${data.error}`;
          transcriptDiv.style.color = '#d9534f';
          button.textContent = originalText;
        }
      } catch (error) {
        transcriptDiv.textContent = `Error: ${error.message}`;
        transcriptDiv.style.color = '#d9534f';
        button.textContent = originalText;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
